# Render Blueprint: one free web service running the existing server.py.
# Secrets are NOT stored here: the API key is entered once in the Render dashboard (sync: false).
services:
  - type: web
    name: hkust-freshmen-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/version
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: FRESHMEN_PUBLIC
        value: "1"
      - key: FRESHMEN_API_KEY
        sync: false            # paste your key in the dashboard; never commit it
      - key: FRESHMEN_MODEL
        value: gpt-5.6-luna
      - key: FRESHMEN_BASE_URL
        value: https://hkust.azure-api.net/hkust-genai-auth/v1
      - key: FRESHMEN_TRUST_PROXY   # Render sits in front: read the visitor IP from X-Forwarded-For
        value: "1"
      - key: FRESHMEN_PER_IP
        value: "30"
      - key: FRESHMEN_WINDOW
        value: "600"
      - key: FRESHMEN_DAILY
        value: "1000"
      - key: FRESHMEN_REFRESH_HOURS
        value: "24"
